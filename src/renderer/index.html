<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' blob: data:"
    />
    <title>Anna</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!--
      The whole window is transparent and click-through. Only `#stage` and the
      composer take pointer events, and only while the pointer is actually over
      them — see setInteractive() in main.ts.
    -->
    <div id="app">
      <!--
        The panel. `#grip` is the only draggable region: making the whole frame
        draggable would mean the input and the buttons could not be clicked,
        because -webkit-app-region: drag swallows every event inside it.
      -->
      <div id="grip" aria-hidden="true"></div>

      <!--
        The stage is a well inside the bezel, not the whole panel. A Proto has
        an opaque enclosure with visible walls, and nothing of the room inside
        it. The still and the clips are appended here by Hologram at runtime —
        the markup is empty because the number of video elements is that
        module's business, not the document's.

        The lit floor that used to be here is gone with the 3D scene. A
        photograph brings its own background, its own light and its own ground;
        painting a cyclorama under it produced two floors at two angles.
      -->
      <div id="well">
        <div id="subtitle" aria-live="polite"></div>
      </div>

      <div id="composer" hidden>
        <input
          id="say"
          type="text"
          autocomplete="off"
          spellcheck="false"
          placeholder="say something"
          aria-label="Talk to Anna"
        />
        <button id="settings" type="button" title="Settings" aria-label="Settings">⚙</button>
        <button
          id="dismiss"
          type="button"
          title="Send her away (⌥⌘A brings her back)"
          aria-label="Hide Anna"
        >
          ✕
        </button>
      </div>

      <div id="trouble" role="status" hidden></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
