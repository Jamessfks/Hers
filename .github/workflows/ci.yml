# CI runs the four things that can be checked without a display or an API key.
#
# Windows is in the matrix because "works on Mac and Windows" is a promise this
# project makes, and the only way that promise stays true is if it is checked.
# The things that break it are unglamorous — a path joined with a forward slash,
# a script chained with `&`, a native module with no prebuilt binary — and every
# one of them fails here rather than on someone's machine.
#
# Node 22.18 is the floor: `node:sqlite` and running TypeScript without a build
# step both need it, and the whole project depends on both.

name: CI

on:
  push:
    branches: [main, 'v1-*', 'pivot/**']
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        node: ['22.18', '24', 'current']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The server has to come up and answer before this counts as passing. A
      # green typecheck on a process that dies on startup is not a green build.
      - name: Start and answer
        shell: bash
        run: |
          node src/server/index.ts &
          server=$!
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5175/api/status > /dev/null; then
              curl -s http://127.0.0.1:5175/api/status
              kill $server
              exit 0
            fi
            sleep 1
          done
          echo "the server never answered"
          kill $server || true
          exit 1
