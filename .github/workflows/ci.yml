# CI runs the four things that can be checked without a display or an API key.
#
# Windows is here because "works on Mac and Windows" is a promise this project
# makes, and the only way that promise stays true is if it is checked. The
# things that break it are unglamorous — a path joined with a forward slash, a
# script chained with `&`, a native module with no prebuilt binary — and every
# one of them fails here rather than on someone's machine.
#
# macOS is deliberately *not* in the matrix, which is a change from the Electron
# version. There is no native code, no code signing and nothing platform-
# specific left in this tree; the runner would be testing Node, not Anna. On a
# private repository macOS minutes bill at ten times Linux and Windows at two,
# so the old six-job matrix cost roughly seven times this one to learn the same
# thing.
#
# Node 22.18 is the floor: `node:sqlite` and running TypeScript without a build
# step both need it, and the whole project depends on both.

name: CI

on:
  push:
    branches: [main, 'v1-*', 'pivot/**']
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ['22.18', '24', 'current']
        include:
          # One Windows job, on the floor version, because that is where a
          # cross-platform mistake shows up first.
          - os: windows-latest
            node: '22.18'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The server has to come up and answer before this counts as passing. A
      # green typecheck on a process that dies on startup is not a green build.
      - name: Start and answer
        shell: bash
        run: |
          node src/server/index.ts &
          server=$!
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5175/api/status > /dev/null; then
              curl -s http://127.0.0.1:5175/api/status
              kill $server
              exit 0
            fi
            sleep 1
          done
          echo "the server never answered"
          kill $server || true
          exit 1
