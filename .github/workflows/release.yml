# Builds the downloadable applications.
#
# Each artifact is built on its own runner. Since v2.0 that is a choice rather
# than a constraint — cutting the phone bridge removed the only native
# dependency in the tree, so a Mac could in principle build the Windows
# installer — but a Windows runner building the Windows installer is the version
# that stays true when a native dependency comes back.
#
# What this workflow did wrong until v2.0, and it is the whole reason anybody
# noticed: it uploaded *workflow artifacts* and stopped. Those are ZIP-wrapped,
# they expire after ninety days, and they need a GitHub login to download —
# while the README linked `releases/latest`, which had nothing in it. Every
# download link in this project was broken and every build was green. The
# release step below is what makes a tag produce something a stranger can click.
#
# Nothing here is signed. See the README for what that means and what to click.

name: Build the applications

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  # Needed to create the release. The default is read, which is why the release
  # step below would have failed silently even once it existed.
  contents: write

jobs:
  build:
    strategy:
      # One failing platform should not take the other's artifact with it —
      # a macOS build that worked is still worth downloading.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS (Apple Silicon)
            artifact: release/*.dmg
          - os: windows-latest
            name: Windows (x64)
            artifact: release/*.exe

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The same gate as `npm run check` locally. A build that ships is not the
      # place to find out a test was red.
      - run: npm run check

      - run: npm run package
        env:
          # Never go looking in a keychain for a certificate. There isn't one,
          # and a runner that finds a stray identity would produce an artifact
          # signed by somebody nobody meant.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: hers-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

      # The artifact above is for a `workflow_dispatch` run, which has no tag to
      # release against. A tag gets a real release, with files a stranger can
      # download without an account.
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: ${{ matrix.artifact }}
          draft: false
          # Both platforms upload to the same release, and whichever runner
          # finishes first creates it.
          fail_on_unmatched_files: true
