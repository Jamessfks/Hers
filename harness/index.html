<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Anna — harness</title>
    <!-- The real stylesheet. Nothing is redefined here; if it looks right in
         this page it looks right in the app. -->
    <link rel="stylesheet" href="/src/renderer/styles.css" />
    <style>
      /* The app runs in a transparent 406x880 window. The harness runs in a
         406x880 viewport, so this page only has to get out of the way. */
      html,
      body {
        background: #2b2b30;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="backdrop"></div>
      <div id="scrim" aria-hidden="true"></div>
      <div id="grip" aria-hidden="true"></div>

      <header id="bar">
        <button id="who" type="button" aria-label="Anna">
          <span>anna</span>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.85"
              stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        <button id="settings" type="button" aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              d="M12 15.6a3.6 3.6 0 100-7.2 3.6 3.6 0 000 7.2z M19.5 12a7.5 7.5 0 00-.11-1.27l2-1.55-1.9-3.29-2.36.95a7.6 7.6 0 00-2.2-1.28L14.6 3h-3.8l-.33 2.56c-.8.3-1.54.73-2.2 1.28l-2.36-.95-1.9 3.29 2 1.55a7.6 7.6 0 000 2.54l-2 1.55 1.9 3.29 2.36-.95c.66.55 1.4.98 2.2 1.28l.33 2.56h3.8l.33-2.56c.8-.3 1.54-.73 2.2-1.28l2.36.95 1.9-3.29-2-1.55c.07-.42.11-.84.11-1.27z"
              fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
          </svg>
        </button>
      </header>

      <div id="thread" role="log" aria-live="polite" aria-label="Conversation"></div>

      <footer id="composer">
        <button id="plus" type="button" aria-label="Add">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.1"
              stroke-linecap="round" />
          </svg>
        </button>
        <div id="field">
          <textarea id="say" rows="1" autocomplete="off" spellcheck="false"
            placeholder="Your message" aria-label="Talk to Anna"></textarea>
          <button id="voice" type="button" aria-label="Talk to her">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                d="M6.6 3.5h-.1c-1.7 0-3 1.4-3 3.1C3.5 14.5 9.5 20.5 17.4 20.5c1.7 0 3.1-1.3 3.1-3v-.1c0-.7-.5-1.4-1.2-1.6l-3-.9c-.6-.2-1.3.1-1.6.6l-.7 1.2c-2.2-1-4-2.8-5-5l1.2-.7c.5-.3.8-1 .6-1.6l-.9-3c-.2-.7-.8-1.2-1.6-1.2z"
                fill="currentColor" />
            </svg>
          </button>
        </div>
      </footer>

      <div id="trouble" role="status" hidden></div>
    </div>
    <script type="module" src="./mock.ts"></script>
  </body>
</html>
